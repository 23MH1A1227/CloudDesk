name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# This workflow validates the project only. It never deploys to AWS.
jobs:
  backend:
    name: Backend (lint, prisma, tests)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: clouddesk
          POSTGRES_PASSWORD: clouddesk
          POSTGRES_DB: clouddesk_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U clouddesk"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    env:
      DATABASE_URL: postgresql://clouddesk:clouddesk@localhost:5432/clouddesk_test?schema=public
      JWT_SECRET: ci_only_secret_not_used_in_production
      NODE_ENV: test

    defaults:
      run:
        working-directory: server

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Validate Prisma schema
        run: npx prisma validate

      - name: Apply migrations
        run: npx prisma migrate deploy

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

  frontend:
    name: Frontend (lint, production build)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: client

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  docker:
    name: Docker compose config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate compose file
        run: docker compose config --quiet
